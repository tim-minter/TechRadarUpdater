<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tech Radar Editor</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    textarea, input { width: 100%; margin-bottom: 10px; }
    .entry { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; }
    .timeline { background: #f9f9f9; padding: 10px; margin-top: 10px; }
    .section { margin-top: 1em; }
  </style>
</head>
<body>
  <h1>Tech Radar Editor</h1>
  <div id="app">Loading…</div>

  <script>
    async function fetchEntries() {
      const res = await fetch('/api/entries');
      return await res.json();
    }

    function render(entries) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      entries.forEach(entry => {
        const el = document.createElement('div');
        el.className = 'entry';
        const latest = entry.timeline[entry.timeline.length - 1] || {};

        el.innerHTML = `
          <label>ID: <input value="${entry.id}" disabled></label><br>
          <label>Title: <input data-key="title" value="${entry.title}"></label><br>
          <label>Quadrant: <input data-key="quadrant" value="${entry.quadrant}"></label><br>

          <div class="section">
            <h4>Latest History Entry (Read-only)</h4>
            <label>Ring: <input value="${latest.ringId || ''}" disabled></label><br>
            <label>Description:</label>
            <textarea disabled>${latest.description || ''}</textarea>
          </div>

          <div class="section">
            <h4>Timeline History</h4>
            <div class="timeline">
              ${entry.timeline.map(h => `<p><b>${h.date}</b> — [${h.ringId}]: ${h.description}</p>`).join('')}
            </div>
          </div>

          <div class="section">
            <h4>Add to History</h4>
            <form onsubmit="return false" class="timeline-form">
              <label>Ring ID: <input name="ringId" required></label><br>
              <label>Description:</label><br>
              <textarea name="desc" required></textarea><br>
              <button>Add History</button>
            </form>
          </div>

          <button class="save">Save Changes</button>
        `;

        // Save button handler (title/quadrant only)
        el.querySelector('.save').onclick = async () => {
          const updated = { ...entry };
          el.querySelectorAll('[data-key]').forEach(input => {
            const key = input.getAttribute('data-key');
            updated[key] = input.value;
          });
          const res = await fetch(`/api/entries/${entry.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updated),
          });
          if (res.ok) alert('Saved!');
        };

        // Add history entry
        el.querySelector('.timeline-form button').onclick = async () => {
          const form = el.querySelector('.timeline-form');
          const ringId = form.ringId.value.trim();
          const desc = form.desc.value.trim();
          if (!ringId || !desc) return alert('Both fields are required.');

          const item = {
            date: new Date().toISOString(),
            description: desc,
            ringId,
            moved: 0,
            isNew: 'TRUE'
          };

          const res = await fetch(`/api/entries/${entry.id}/history`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(item),
          });
          const updated = await res.json();
          render(entries.map(e => e.id === updated.id ? updated : e));
        };

        app.appendChild(el);
      });
    }

    fetchEntries().then(render);
  </script>
</body>
</html>
